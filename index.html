<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 25px 18px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #fff2a8;
    }

    img {
      width: 210px;
      height: 210px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      padding: 12px 20px;
      margin: 8px 4px;
      border: none;
      border-radius: 25px;
      background: #ffdf59;
      color: #70204f;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: white;
    }
  </style>
</head>

<body>
  <div class="card">

    <h1>🎂 Happy Birthday 🎂</h1>

    <img src="photo.jpg" alt="Birthday Photo">

    <h2>Saru❤️</h2>

    <p>
      May your life be filled with love,
      happiness, and beautiful memories.
      You deserve all the happiness in the world!
    </p>

    <h2>🎉 Have a Wonderful Birthday! 🎉</h2>

    <audio id="music" src="song.mp3" loop></audio>

    <button onclick="playMusic()">
      🎵 Play Music
    </button>

    <button onclick="showSurprise()">
      💖 Surprise
    </button>

  </div>

  <script>
    function playMusic() {
      const music = document.getElementById("music");

      music.play().catch(() => {
        alert("Please tap the Play Music button again.");
      });
    }

    function showSurprise() {
      alert("You are special! Sending you lots of love ❤️🎂");
    }
  </script>
</body>
  </html>
